version: '3.7'
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8001:8000" # host:container
    command: "-jar DynamoDBLocal.jar -inMemory -port 8000"
    # command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data -port 8000"
    # volumes: # Optional: For persistent data
    #   - ./dynamodb_data:/home/dynamodblocal/data

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8002:8001"  # host:container
    environment:
      DYNAMO_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "us-east-1" # Or your desired region
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      PORT: 8001
    depends_on:
      - dynamodb-local